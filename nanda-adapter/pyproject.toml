[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nest-plugin-prava"
version = "0.1.0"
description = "Prava agentic-payments plugin for the NANDA Town payments layer, backed by policy-bounded envelopes."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [{ name = "Saran Teja Mallela" }]
keywords = ["nanda", "nest", "payments", "prava", "agentic-commerce"]
dependencies = ["nest-core", "httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[project.entry-points."nest.plugins.payments"]
prava = "nest_plugin_prava.plugin:PravaPayments"

[tool.hatch.build.targets.wheel]
packages = ["nest_plugin_prava"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "A", "SIM", "TCH"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
